name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      # Don't cancel the Linux run when macOS runners are unavailable
      fail-fast: false
      matrix:
        # The Makefile downloads the macOS ARMv8 / Linux x64 builds of Squeak
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SQUEAK_DIR: ${{ github.workspace }}/../squeak-epic
    steps:
      - uses: actions/checkout@v4

      - name: Cache Squeak VM
        uses: actions/cache@v4
        with:
          path: ${{ env.SQUEAK_DIR }}/Squeak*
          key: squeak-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: Build image
        run: make image

      - name: Run tests
        run: make test

      # The app bundle needs macOS tools (hdiutil, plutil, codesign, ditto)
      - name: Build app
        if: runner.os == 'macOS'
        run: make app

      - name: Upload app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: EPIC
          path: build/EPIC.zip

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: squeak-logs-${{ runner.os }}
          path: |
            ${{ env.SQUEAK_DIR }}/load-error.txt
            ${{ env.SQUEAK_DIR }}/test-results.txt
            ${{ env.SQUEAK_DIR }}/lockdown-error.txt
          if-no-files-found: ignore
